<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Base href so any relative URL on this page resolves against the
      jsDelivr-mirrored repo. Update <user>/<repo>@<ref> if you fork.
    -->
    <base href="https://cdn.jsdelivr.net/gh/xunubis/scramjet2@main/" />
    <title>Prism</title>
    <meta name="description" content="Prism — web proxy. Launch the full app on Lovable." />
    <link rel="icon" href="public/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #07070b; color: #e8e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 2rem; }
      .card { max-width: 32rem; text-align: center; }
      h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; letter-spacing: -0.02em; }
      p { opacity: .75; line-height: 1.55; margin: 0 0 1.5rem; }
      a.btn { display: inline-block; padding: .85rem 1.4rem; border-radius: .75rem;
        background: linear-gradient(135deg,#6366f1,#a855f7); color: #fff;
        text-decoration: none; font-weight: 600; }
      a.btn:hover { filter: brightness(1.1); }
      small { display: block; margin-top: 1.25rem; opacity: .4; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Prism</h1>
        <p>
          The full proxy needs to run from its own origin so the service worker
          can register. This CDN page redirects you to the live app.
        </p>
        <a class="btn" href="https://scramjet2.lovable.app/">Launch Prism</a>
        <small>Served via jsDelivr · backend: scramjet2.lovable.app</small>
      </div>
    </main>
    <script>
      // Auto-forward unless the visitor explicitly asked to stay (?stay=1)
      if (!new URLSearchParams(location.search).has('stay')) {
        setTimeout(() => { location.replace('https://scramjet2.lovable.app/'); }, 1200);
      }
    </script>
  </body>
</html>
