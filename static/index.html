<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Prism</title>
<meta name="description" content="Prism — fast, private web proxy." />
<style>
  :root { color-scheme: dark; --bg:#0a0a0f; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg); color: #e7e7ee;
    overflow: hidden; overscroll-behavior: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Use dynamic viewport units so mobile browser chrome doesn't cause scrollbars */
  #app {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
    border: 0; display: block;
    background: var(--bg);
  }
  #fallback {
    position: fixed; inset: 0;
    display: none; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow: auto;
  }
  #fallback.show { display: grid; }
  .card {
    width: 100%; max-width: 460px;
    padding: clamp(20px, 4vw, 28px);
    background: linear-gradient(180deg, #15151d, #0f0f16);
    border: 1px solid #232334; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: clamp(18px, 4.5vw, 22px); letter-spacing: -.01em; }
  p  { margin: 0 0 18px; color: #a5a5b8; font-size: 14px; line-height: 1.5; }
  a.btn {
    display: inline-block; padding: 11px 18px; border-radius: 10px;
    background: linear-gradient(135deg,#7c3aed,#4f46e5);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  a.btn:hover { filter: brightness(1.1); }
  .muted { margin-top: 14px; font-size: 12px; color: #6c6c80; }
  .muted a { color: #9b9bb3; }
</style>
</head>
<body>
<iframe
  id="app"
  src="https://scramjet2.lovable.app/"
  allow="clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture"
  allowfullscreen
  referrerpolicy="no-referrer"
  title="Prism"
></iframe>

<div id="fallback" role="alert">
  <div class="card">
    <h1>Embed blocked</h1>
    <p>This browser or network prevented Prism from loading inside an iframe. Open the full app in a new tab instead.</p>
    <a class="btn" href="https://scramjet2.lovable.app/" target="_blank" rel="noopener">Open Prism →</a>
    <div class="muted">Or visit <a href="https://scramjet2.lovable.app/">scramjet2.lovable.app</a> directly.</div>
  </div>
</div>

<script>
  (function () {
    var frame = document.getElementById('app');
    var fb = document.getElementById('fallback');
    var loaded = false;
    frame.addEventListener('load', function () { loaded = true; });
    setTimeout(function () {
      if (!loaded) {
        try { frame.style.display = 'none'; } catch (_) {}
        fb.classList.add('show');
      }
    }, 6000);
  })();
</script>
</body>
</html>
